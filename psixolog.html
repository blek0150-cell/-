
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Сюзан Мкртчян — Услуги</title>

<link href="https://fonts.googleapis.com/css2?family=Forum&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #3B2A24;
  --white: #ffffff;
  --text: #1a120e;
  --accent: #e9e2dd;
  --hover: #795548;
}

* { box-sizing: border-box; margin:0; padding:0; }
html, body { height: 100%; }
body {
  font-family: 'Forum', serif;
  color: var(--white);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

main { padding: 40px 0; }

/* Секции */
section {
  display: flex;
  gap: 40px;
  width: min(1200px, 100%);
  margin: 0 auto 80px;
  padding: 0 20px;
  align-items: center;
  flex-wrap: wrap;
}

section .image, section .text-card {
  flex: 1 1 500px;
}

/* Картинка */
.image {
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,.2);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  opacity: 0;
  transform: scale(0.95);
  transition: opacity 0.8s ease, transform 0.8s ease;
}
.image.visible { opacity: 1; transform: scale(1); }
.image img {
  width: 100%;
  height: auto;
  max-height: 600px;
  object-fit: cover;
  transition: transform 0.3s ease-out;
  will-change: transform;
}

/* Текст */
.text-card {
  background: var(--white);
  color: var(--text);
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,.2);
  display: flex;
  flex-direction: column;
  justify-content: center;
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.8s ease, transform 0.8s ease;
  font-size: 1.2em;
}
.text-card.visible { opacity: 1; transform: translateY(0); }
.text-card h1 { font-size: clamp(32px, 4vw, 48px); margin-bottom: 0.5em; }
.text-card h3 { font-size: 1.4em; margin: 1em 0 0.5em; }
.text-card ul { margin-left: 1.2em; margin-bottom: 1em; }
.text-card ul li { margin-bottom: 0.5em; font-size: 1.15em; }

/* Увеличение картинок для второй и третьей секции */
section:nth-of-type(2) .image img,
section:nth-of-type(3) .image img {
  width: 110%;
  max-width: none;
}

/* Адаптив для мобильных */
@media (max-width: 900px) {
  section { flex-direction: column; gap: 24px; }
  .image img { max-height: 70vh; width: 100%; }
}
</style>
</head>
<body>
<main>
  <section>
    <div class="image">
      <img src="2.avif" alt="Психологическая сессия">
    </div>
    <div class="text-card">
    
        <li>Сессия очно/онлайн 3000₽/15000֏ </li>
        <li>Пакет из 5 сессий 10.000₽/50.000֏  </li> 
      </ul>
    </div>
  </section>


</body>
</html>
